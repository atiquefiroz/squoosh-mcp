[package]
name = "squoosh-mcp-ssim2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "SSIMULACRA 2 scoring for squoosh-mcp, compiled to WebAssembly (C ABI, no JS glue)."

[lib]
crate-type = ["cdylib"]

[dependencies]
fast-ssim2 = { version = "=0.9.1", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
