name: Release

# Publishes to npm when a GitHub release is published. Uses npm trusted publishing
# (OIDC), so no npm token is stored in GitHub, and npm adds provenance itself.
# One-time setup on npmjs.com: package settings → Trusted publishing → GitHub Actions,
# repository atiquefiroz/squoosh-mcp, workflow release.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: Tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      # prepublishOnly builds and runs the tests first.
      - run: npm publish
